name: release

on:
  push:
    tags:
      - "v*"  # Only trigger on version tags for releases

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write  # Required for pushing Docker images to GHCR
      id-token: write  # Required for OIDC token generation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22.5'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Generate install manifest
        run: >
          helm template ./chart/
          --set global.oci.registry=ghcr.io/${{ github.repository }} --set global.chaos.defaultImage.tag=${GITHUB_REF_NAME}
          > ./chart/install.yaml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILDGOVERSION: "1.23.1"

      - name: Update chart version and package Helm chart
        run: |
          # Extract version from tag (remove 'v' prefix)
          CHART_VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: $CHART_VERSION/" ./chart/Chart.yaml
          echo "Updated chart version to: $CHART_VERSION"

          export HELM_EXPERIMENTAL_OCI=1
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          helm package ./chart/
          helm push chaos-controller-*.tgz oci://ghcr.io/${{ github.repository }}/helm
