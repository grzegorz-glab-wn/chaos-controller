name: release

on:
  push:
    tags:
      - "v*"  # Only trigger on version tags for releases

jobs:
  goreleaser:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write  # Required for pushing Docker images to GHCR
      id-token: write  # Required for OIDC token generation
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Unshallow
        run: git fetch --prune --unshallow
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '>=1.22.5'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Images are built from the upstream self-building Dockerfiles (full repo
      # context) rather than goreleaser dockers_v2, which only provides
      # prebuilt binaries as build context.
      - name: Build and push chaos-controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILDGOVERSION=1.26.2
          tags: |
            ghcr.io/${{ github.repository }}/chaos-controller:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/chaos-controller:latest

      - name: Build and push chaos-injector image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/injector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILDGOVERSION=1.26.2
          tags: |
            ghcr.io/${{ github.repository }}/chaos-injector:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/chaos-injector:latest

      - name: Build and push chaos-handler image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/handler/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILDGOVERSION=1.26.2
          tags: |
            ghcr.io/${{ github.repository }}/chaos-handler:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/chaos-handler:latest

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Generate install manifest
        run: >
          helm template ./chart/
          --set global.oci.registry=ghcr.io/${{ github.repository }} --set global.chaos.defaultImage.tag=${GITHUB_REF_NAME}
          > ./chart/install.yaml

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BUILDGOVERSION: "1.26.2"

      - name: Update chart version and package Helm chart
        run: |
          # Extract version from tag (remove 'v' prefix)
          CHART_VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version:.*/version: $CHART_VERSION/" ./chart/Chart.yaml
          echo "Updated chart version to: $CHART_VERSION"

          # Update default image tag in values.yaml
          sed -i "s/tag: latest/tag: ${GITHUB_REF_NAME}/" ./chart/values.yaml
          echo "Updated default image tag to: ${GITHUB_REF_NAME}"

          export HELM_EXPERIMENTAL_OCI=1
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin
          helm package ./chart/
          helm push chaos-controller-*.tgz oci://ghcr.io/${{ github.repository }}/helm
