version: 2

before:
  hooks:
    - go mod download
    - make docker-build-ebpf  # Ensure eBPF builds for injector

builds:
  - id: controller
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: injector
    binary: injector
    main: ./cli/injector
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: handler
    binary: handler
    main: ./cli/handler
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: chaosli
    binary: chaosli
    main: ./cli/chaosli
    goos:
      - linux
      - darwin
    ldflags:
      - -X github.com/DataDog/chaos-controller/cli/chaosli/cmd.Version={{ .Tag }}

dockers:
  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-controller:{{ .Tag }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-controller:latest"
    dockerfile: bin/manager/Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=BUILDGOVERSION={{ .Env.BUILDGOVERSION | default "1.23.1" }}"
      - "--build-arg=BUILDSTAMP={{ .Date }}"
    ids:
      - controller

  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-injector:{{ .Tag }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-injector:latest"
    dockerfile: bin/injector/Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=BUILDGOVERSION={{ .Env.BUILDGOVERSION | default "1.23.1" }}"
      - "--build-arg=BUILDSTAMP={{ .Date }}"
    ids:
      - injector

  - image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-handler:{{ .Tag }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-handler:latest"
    dockerfile: bin/handler/Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=BUILDGOVERSION={{ .Env.BUILDGOVERSION | default "1.23.1" }}"
      - "--build-arg=BUILDSTAMP={{ .Date }}"
    ids:
      - handler

archives:
  - id: controller
    builds:
      - controller
      - injector
      - handler
    files:
    - LICENSE
    - LICENSE-3rdparty.csv
    - NOTICE
    - README.md
    - docs/*
  - id: chaosli
    builds:
      - chaosli
    format: binary
release:
  extra_files:
    - glob: ./chart/install.yaml
  header: |
    ## Quick Installation

    > :mega: _**Datadog engineers:** please reach out to Chaos Engineering before deploying to a new cluster! :pray: :bow:_

    > :warning: _[cert-manager](https://cert-manager.io/docs/installation/kubernetes/) must be installed for the admission controller to get a self-signed certificate._

    If you do not plan to alter source code, you can install **Chaos Controller** to your existing Kubernetes environments by running:

    > :mega: _**Datadog engineers:** please reach out to Chaos Engineering before deploying to a new cluster! :pray: :bow:_

    ```
    kubectl apply -f https://github.com/DataDog/chaos-controller/releases/download/{{ .Tag }}/install.yaml
    ```
