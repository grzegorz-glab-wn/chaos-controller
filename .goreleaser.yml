version: 2

before:
  hooks:
    - go mod download

builds:
  - id: controller
    binary: manager
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: injector
    binary: injector
    main: ./cli/injector
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: handler
    binary: handler
    main: ./cli/handler
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
  - id: chaosli
    binary: chaosli
    main: ./cli/chaosli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
    ldflags:
      - -X github.com/DataDog/chaos-controller/cli/chaosli/cmd.Version={{ .Tag }}

dockers_v2:
  - id: controller
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-controller"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: bin/manager/Dockerfile
    platforms:
      - linux/amd64
    build_args:
      BUILDGOVERSION: "{{ .Env.BUILDGOVERSION }}"
      BUILDSTAMP: "{{ .Date }}"
    ids:
      - controller

  - id: injector
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-injector"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: bin/injector/Dockerfile
    platforms:
      - linux/amd64
    build_args:
      BUILDGOVERSION: "{{ .Env.BUILDGOVERSION }}"
      BUILDSTAMP: "{{ .Date }}"
    ids:
      - injector

  - id: handler
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY }}/chaos-handler"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: bin/handler/Dockerfile
    platforms:
      - linux/amd64
    build_args:
      BUILDGOVERSION: "{{ .Env.BUILDGOVERSION }}"
      BUILDSTAMP: "{{ .Date }}"
    ids:
      - handler

archives:
  - id: controller
    ids: [controller, injector, handler]
    files:
      - LICENSE
      - LICENSE-3rdparty.csv
      - NOTICE
      - README.md
      - docs/*
  - id: chaosli
    ids: [chaosli]
    formats: ['binary']
release:
  extra_files:
    - glob: ./chart/install.yaml
  header: |
    ## Quick Installation

    > :mega: _**Datadog engineers:** please reach out to Chaos Engineering before deploying to a new cluster! :pray: :bow:_

    > :warning: _[cert-manager](https://cert-manager.io/docs/installation/kubernetes/) must be installed for the admission controller to get a self-signed certificate._

    If you do not plan to alter source code, you can install **Chaos Controller** to your existing Kubernetes environments by running:

    > :mega: _**Datadog engineers:** please reach out to Chaos Engineering before deploying to a new cluster! :pray: :bow:_

    ```
    kubectl apply -f https://github.com/DataDog/chaos-controller/releases/download/{{ .Tag }}/install.yaml
    ```
